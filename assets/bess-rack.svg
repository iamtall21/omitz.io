<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Illustration of lithium-ion battery racks inside an energy storage enclosure</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC1CD"/><stop offset="1" stop-color="#A3CE53"/>
    </linearGradient>
    <g id="module">
      <rect width="120" height="34" rx="3" fill="#1b2050" stroke="#2c3270"/>
      <rect x="8" y="9" width="44" height="16" rx="2" fill="#262c63"/>
      <circle cx="96" cy="17" r="4" fill="#A3CE53"/><circle cx="108" cy="17" r="4" fill="#4FC1CD"/>
    </g>
    <g id="rack">
      <rect x="-10" y="-14" width="140" height="330" rx="4" fill="#0c0f2e" stroke="#2c3270" stroke-width="2"/>
      <use href="#module" y="0"/><use href="#module" y="40"/><use href="#module" y="80"/><use href="#module" y="120"/>
      <use href="#module" y="160"/><use href="#module" y="200"/><use href="#module" y="240"/>
      <rect x="0" y="282" width="120" height="22" rx="2" fill="url(#brand)"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="#10133A"/>
  <!-- floor -->
  <polygon points="0,420 800,420 800,450 0,450" fill="#0a0c26"/>
  <g transform="translate(60,80)"><use href="#rack"/></g>
  <g transform="translate(240,80)"><use href="#rack"/></g>
  <g transform="translate(420,80)"><use href="#rack"/></g>
  <!-- BMS / fire panel -->
  <g transform="translate(620,90)">
    <rect width="130" height="170" rx="6" fill="#ffffff"/>
    <rect x="12" y="14" width="106" height="56" rx="3" fill="#10133A"/>
    <polyline points="20,58 38,46 52,52 70,30 88,40 108,24" fill="none" stroke="#A3CE53" stroke-width="3"/>
    <text x="65" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#10133A">BMS</text>
    <rect x="16" y="108" width="98" height="10" rx="5" fill="#e3e8ec"/><rect x="16" y="108" width="72" height="10" rx="5" fill="#4FC1CD"/>
    <circle cx="36" cy="144" r="10" fill="#A3CE53"/><circle cx="65" cy="144" r="10" fill="#e3e8ec"/><circle cx="94" cy="144" r="10" fill="#e3e8ec"/>
  </g>
  <!-- gas detector + sprinkler line -->
  <line x1="0" y1="34" x2="800" y2="34" stroke="#4FC1CD" stroke-width="4" opacity=".7"/>
  <g fill="#4FC1CD" opacity=".9"><circle cx="150" cy="44" r="6"/><circle cx="330" cy="44" r="6"/><circle cx="510" cy="44" r="6"/></g>
  <g transform="translate(660,300)">
    <rect width="50" height="64" rx="6" fill="#ffffff"/>
    <circle cx="25" cy="24" r="12" fill="none" stroke="#10133A" stroke-width="3"/>
    <circle cx="25" cy="24" r="4" fill="#A3CE53"/>
    <rect x="12" y="46" width="26" height="6" rx="3" fill="#10133A"/>
  </g>
</svg>
