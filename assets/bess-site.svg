<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Illustration of a containerized battery energy storage system site</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3f5"/><stop offset="1" stop-color="#f3f9ec"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC1CD"/><stop offset="1" stop-color="#A3CE53"/>
    </linearGradient>
    <pattern id="vent" width="10" height="8" patternUnits="userSpaceOnUse">
      <rect width="10" height="8" fill="#e9eef2"/><rect y="5" width="10" height="2" fill="#c5cfd8"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- solar array in background -->
  <g fill="#10133A" opacity=".18">
    <polygon points="40,250 150,250 165,215 55,215"/><polygon points="170,250 280,250 295,215 185,215"/>
    <polygon points="520,250 630,250 645,215 535,215"/><polygon points="650,250 760,250 775,215 665,215"/>
  </g>
  <!-- transmission tower -->
  <g stroke="#10133A" stroke-width="3" fill="none" opacity=".35">
    <path d="M700 260 L720 120 L740 260 M708 200 L732 200 M712 160 L728 160 M690 140 L750 140"/>
  </g>
  <!-- ground -->
  <rect y="300" width="800" height="150" fill="#d9dfe3"/>
  <rect y="296" width="800" height="8" fill="#c3cbd1"/>
  <!-- containers -->
  <g>
    <g transform="translate(60,190)">
      <rect width="300" height="110" rx="4" fill="#ffffff" stroke="#10133A" stroke-width="3"/>
      <rect x="10" y="12" width="280" height="22" fill="url(#vent)"/>
      <g fill="none" stroke="#10133A" stroke-width="2">
        <rect x="12" y="44" width="62" height="58"/><rect x="82" y="44" width="62" height="58"/>
        <rect x="156" y="44" width="62" height="58"/><rect x="226" y="44" width="62" height="58"/>
      </g>
      <rect x="0" y="0" width="300" height="8" fill="url(#brand)"/>
      <g transform="translate(130,52)"><rect width="40" height="22" rx="3" fill="#10133A"/><rect x="40" y="7" width="4" height="8" fill="#10133A"/><rect x="5" y="5" width="24" height="12" fill="#A3CE53"/></g>
    </g>
    <g transform="translate(400,190)">
      <rect width="300" height="110" rx="4" fill="#ffffff" stroke="#10133A" stroke-width="3"/>
      <rect x="10" y="12" width="280" height="22" fill="url(#vent)"/>
      <g fill="none" stroke="#10133A" stroke-width="2">
        <rect x="12" y="44" width="62" height="58"/><rect x="82" y="44" width="62" height="58"/>
        <rect x="156" y="44" width="62" height="58"/><rect x="226" y="44" width="62" height="58"/>
      </g>
      <rect x="0" y="0" width="300" height="8" fill="url(#brand)"/>
      <g transform="translate(130,52)"><rect width="40" height="22" rx="3" fill="#10133A"/><rect x="40" y="7" width="4" height="8" fill="#10133A"/><rect x="5" y="5" width="30" height="12" fill="#4FC1CD"/></g>
    </g>
  </g>
  <!-- inverter / transformer skid -->
  <g transform="translate(720,240)">
    <rect width="56" height="60" rx="3" fill="#10133A"/>
    <g stroke="#4FC1CD" stroke-width="2"><line x1="10" y1="14" x2="46" y2="14"/><line x1="10" y1="22" x2="46" y2="22"/><line x1="10" y1="30" x2="46" y2="30"/></g>
    <path d="M24 40 l8 0 -6 10 8 0 -12 14 3 -10 -7 0z" fill="#A3CE53"/>
  </g>
  <!-- conduit -->
  <path d="M360 290 H400 M700 290 H720" stroke="#10133A" stroke-width="4"/>
  <!-- fence -->
  <g stroke="#10133A" stroke-width="2" opacity=".55">
    <line x1="0" y1="340" x2="800" y2="340"/><line x1="0" y1="372" x2="800" y2="372"/>
    <g id="posts"><line x1="20" y1="330" x2="20" y2="392"/><line x1="100" y1="330" x2="100" y2="392"/><line x1="180" y1="330" x2="180" y2="392"/><line x1="260" y1="330" x2="260" y2="392"/><line x1="340" y1="330" x2="340" y2="392"/><line x1="420" y1="330" x2="420" y2="392"/><line x1="500" y1="330" x2="500" y2="392"/><line x1="580" y1="330" x2="580" y2="392"/><line x1="660" y1="330" x2="660" y2="392"/><line x1="740" y1="330" x2="740" y2="392"/></g>
  </g>
  <!-- safety sign -->
  <g transform="translate(372,350)">
    <rect x="-2" y="18" width="4" height="34" fill="#10133A"/>
    <polygon points="0,-6 22,32 -22,32" fill="#A3CE53" stroke="#10133A" stroke-width="2"/>
    <text x="0" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#10133A">!</text>
  </g>
</svg>
